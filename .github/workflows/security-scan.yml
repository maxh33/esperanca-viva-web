name: Security scan (supply-chain)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phantom-raven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PhantomRaven npm vulnerability scan
        uses: maxh33/phantom-raven-npm-vulnerability-scanner@main
        with:
          path: .
          fail-on-critical: true
